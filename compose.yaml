services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firstsports
      POSTGRES_USER: firstsports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstsports -d firstsports"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
